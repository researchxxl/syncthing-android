version: 2
updates:
- package-ecosystem: gradle
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  groups:
    dagger:
      patterns:
        - "com.google.dagger:dagger*"
  ignore:
  - dependency-name: com.google.zxing:core
    versions:
    - "> 3.3.0"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  groups:
    actions-core:
      patterns:
        - "actions/*"
